name: Nightly Release Deploy

on:
  schedule:
    # 06:00 UTC nightly
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Check for new commits since last deploy
        id: check
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          if git rev-parse -q --verify refs/tags/last-deployed-release >/dev/null; then
            LAST_SHA=$(git rev-parse refs/tags/last-deployed-release)
          else
            LAST_SHA=""
          fi
          echo "current=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_SHA" = "$LAST_SHA" ]; then
            echo "No new commits on release since last deploy ($LAST_SHA). Skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found (last deployed: ${LAST_SHA:-none}, current: $CURRENT_SHA)."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: npm run build

      - name: Deploy to Firebase Hosting
        if: steps.check.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: ai-studio-applet-webapp-742af
          channelId: live

      - name: Record deployed commit
        if: steps.check.outputs.changed == 'true'
        run: |
          git tag -f last-deployed-release "${{ steps.check.outputs.current }}"
          git push origin -f last-deployed-release
